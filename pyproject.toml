[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beautivizf1"
version = "0.1.0"
description = "Chatbot simple de datavisualisation F1"
requires-python = ">=3.11"
dependencies = [
    "fastf1",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
